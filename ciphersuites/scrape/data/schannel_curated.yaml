# Hand-curated Schannel cipher suites. Schannel has no public source code,
# so this file is transcribed by hand from Microsoft Learn rather than
# scraped. Index page:
#   https://learn.microsoft.com/en-us/windows/win32/secauthn/cipher-suites-in-schannel
# Transcription date: 2026-11-08.
#
# One entry per "TLS Cipher Suites in Windows ..." page, oldest first; that
# order is the version order. Each entry lists every suite named on the page:
# the enabled-by-default table, the "supported but not enabled by default"
# table and (Windows 10 1607 onwards) the PSK table are all merged, because
# every one of them is a suite Schannel supports.
#
# Microsoft's pages give suite names only. Code points come from the IANA
# registry (ciphersuites/_ciphersuites/iana.yaml), except for the suites
# IANA's registry in this repository lacks, marked "(not in IANA data)" below:
# TLS_*_EXPORT1024_* (draft-ietf-tls-56-bit-ciphersuites) and SSL_CK_*
# (SSL 2.0 three-byte codes).
#
# Windows 7 to 8.1 and Windows Vista list the ECDHE suites once per curve
# with a _P256/_P384/_P521 suffix. The suffix names a curve, not a suite, so
# it is stripped and the suite is listed once.
#
# v1 ciphersuites/_ciphersuites/schannel.yaml cross-check: every v1 code point
# is present below. The v1 names that are NOT listed below are the curve-
# suffixed ones (TLS_ECDHE_*_P256/_P384/_P521, same code points as the
# unsuffixed suites) and SSL_CK_RC4_128_EXPORT40_MD5 (same code point as
# SSL_CK_RC4_128_EXPORT40_WITH_MD5, the spelling Microsoft Learn uses).
# No v1 code point is missing from every Microsoft Learn page, so there are no
# "# not in any Microsoft Learn page" entries.
versions:
  - label: Windows Vista
    # Page lists only suites that are supported but not present by default.
    source: https://learn.microsoft.com/en-us/windows/win32/secauthn/schannel-cipher-suites-in-windows-vista
    suites:
      - {name: TLS_RSA_WITH_AES_128_CBC_SHA, code_point: ['0x00', '0x2F']}
      - {name: TLS_RSA_WITH_AES_256_CBC_SHA, code_point: ['0x00', '0x35']}
      - {name: TLS_RSA_WITH_RC4_128_SHA, code_point: ['0x00', '0x05']}
      - {name: TLS_RSA_WITH_3DES_EDE_CBC_SHA, code_point: ['0x00', '0x0A']}
      - {name: TLS_ECDHE_ECDSA_WITH_AES_128_CBC_SHA, code_point: ['0xC0', '0x09']}
      - {name: TLS_ECDHE_ECDSA_WITH_AES_256_CBC_SHA, code_point: ['0xC0', '0x0A']}
      - {name: TLS_ECDHE_RSA_WITH_AES_128_CBC_SHA, code_point: ['0xC0', '0x13']}
      - {name: TLS_ECDHE_RSA_WITH_AES_256_CBC_SHA, code_point: ['0xC0', '0x14']}
      - {name: TLS_DHE_DSS_WITH_AES_128_CBC_SHA, code_point: ['0x00', '0x32']}
      - {name: TLS_DHE_DSS_WITH_AES_256_CBC_SHA, code_point: ['0x00', '0x38']}
      - {name: TLS_DHE_DSS_WITH_3DES_EDE_CBC_SHA, code_point: ['0x00', '0x13']}
      - {name: TLS_RSA_WITH_RC4_128_MD5, code_point: ['0x00', '0x04']}
      - {name: SSL_CK_RC4_128_WITH_MD5, code_point: ['0x01', '0x00', '0x80']}  # (not in IANA data)
      - {name: SSL_CK_DES_192_EDE3_CBC_WITH_MD5, code_point: ['0x07', '0x00', '0xC0']}  # (not in IANA data)
      - {name: TLS_RSA_WITH_NULL_MD5, code_point: ['0x00', '0x01']}
      - {name: TLS_RSA_WITH_NULL_SHA, code_point: ['0x00', '0x02']}
